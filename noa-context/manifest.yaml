display_information:
  name: Noa Context
  description: Provides Slack context to Noa
oauth_config:
  redirect_urls:
    - https://localhost:5678/rest/oauth2-credential/callback
  scopes:
    user:
      - mpim:history
      - channels:history
      - channels:read
      - files:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - mpim:read
      - reactions:read
      - search:read
      - search:read.files
      - search:read.im
      - search:read.mpim
      - search:read.private
      - search:read.public
      - search:read.users
      - users.profile:read
      - users:read
      - users:read.email
  pkce_enabled: false
settings:
  event_subscriptions:
    request_url: https://n8n.mulatta.io/webhook/0dfff531-0d13-4c08-9a74-29012191f466/webhook
    user_events:
      - reaction_added
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  is_mcp_enabled: false
